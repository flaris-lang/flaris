name: Bug report
description: Something in a library, example or the VM behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are the ones that usually decide
        whether a bug can be reproduced on the first try.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: I expected CSV.Parse to return 3 rows, but it returned 2.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal script that reproduces it
      description: The smallest `.fls` file that shows the problem.
      render: js
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Flaris version
      description: Output of `flarisvm --version`
      placeholder: "1.0.0.8"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 (arm64) / Ubuntu 24.04 (x86-64) / Windows 11 (x64)
    validations:
      required: true

  - type: dropdown
    id: crash
    attributes:
      label: Did the VM crash?
      description: A crash is a different class of bug and is prioritised.
      options:
        - "No - it ran but gave the wrong result"
        - "Yes - it crashed or hung"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Flags used (`--jit`, `--unsafe`), library version, output.
