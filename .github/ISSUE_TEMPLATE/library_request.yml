name: New library proposal
description: Propose a library for the standard set, or offer to write one
labels: ["library"]
body:
  - type: input
    id: name
    attributes:
      label: Library name
      placeholder: Toml
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: What it does
      description: And why it belongs in the standard set rather than staying separate.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Rough API
      description: A few calls, so the shape can be discussed before code exists.
      render: js

  - type: dropdown
    id: native
    attributes:
      label: Does it need native code?
      description: FFI or raw memory means it requires `--unsafe` at runtime.
      options:
        - "No - pure Flaris"
        - "Yes - needs an FFI shim"
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: Who would write it?
      options:
        - "I would like to write it"
        - "I am proposing it for someone else to pick up"
    validations:
      required: true
